# ============================================
#  config.yaml - הגדרות סוכן חיפוש העבודה
# ============================================
# העתיקי קובץ זה ל-config.yaml ומלאי את הפרטים שלך.
# אל תעלי את config.yaml (עם הטוקן האמיתי) לשום מקום ציבורי!

telegram:
  bot_token: "PUT_YOUR_BOT_TOKEN_HERE"   # מקבלים מ-BotFather בטלגרם
  chat_id: "PUT_YOUR_CHAT_ID_HERE"       # ה-ID של הצ'אט שלך

# מילות מפתח - הסוכן יסמן כ"רלוונטי" רק משרות שהכותרת/הטקסט שלהן
# מכיל לפחות אחת מהמילים האלה (לא רגיש לרישיות, גם עברית וגם אנגלית)
keywords:
  - "Product Manager"
  - "מנהל/ת מוצר"
  - "Product Owner"
  # הוסיפי כאן את התפקידים שאת מחפשת

# מילים לפסילה אוטומטית (למשל אם מחפשת ג'וניור ולא רוצה סניור, וההפך)
exclude_keywords:
  - "Senior Senior"   # דוגמה - אפשר להשאיר ריק: []

# ============================================
# רשימת האתרים לסריקה
# ============================================
# יש 2 סוגי אתרים נתמכים:
#
# 1) type: "generic"
#    מתאים לרוב עמודי "משרות" של חברות (במיוחד אלו שיש לך בהן איש קשר).
#    הסוכן פשוט סורק את כל הקישורים בעמוד ומחפש התאמה למילות המפתח.
#    לא צריך הגדרות מיוחדות - רק לינק לעמוד הקריירה של החברה.
#
# 2) type: "css"
#    מתאים לאתרי דרושים גדולים (AllJobs, Drushim וכו') שבהם יש מבנה קבוע
#    של תוצאות חיפוש. צריך להגדיר סלקטורים (CSS selectors) - איך למצוא
#    אותם, ראי בקובץ README.md סעיף "איך מוצאים סלקטורים".

sites:
  # --- דוגמה לחברה עם איש קשר (עמוד קריירה כללי) ---
  - name: "חברת דוגמה - עמוד קריירה"
    type: "generic"
    url: "https://example.com/careers"

  # --- דוגמה לאתר דרושים גדול עם סלקטורים (למלא בפועל) ---
  - name: "AllJobs - חיפוש Product Manager"
    type: "css"
    url: "https://www.alljobs.co.il/SearchResultsGuest.aspx?position=Product+Manager"
    selectors:
      job_container: ".job-item"     # דוגמה - יש לעדכן לפי הבדיקה שלך
      title: ".job-title"
      link: "a"
      link_attr: "href"
      base_url: "https://www.alljobs.co.il"

  # הוסיפי כאן עוד אתרים מהרשימה שלך, באותה תבנית
